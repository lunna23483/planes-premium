<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enlazados</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}
body{
    background:#0b1020;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.container{
    width:100%;
    max-width:1100px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}
.card{
    background:#111936;
    border:1px solid rgba(255,255,255,0.1);
    border-radius:25px;
    padding:40px 25px;
    text-align:center;
    transition:0.3s;
    cursor:pointer;
}
.card:hover{
    transform:translateY(-8px);
    box-shadow:0 10px 30px rgba(0,255,255,0.2);
}
.icon{
    font-size:60px;
    margin-bottom:20px;
}
h2{
    color:white;
    font-size:28px;
}
.link-box{
    margin-top:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:12px;
    padding:10px 14px;
    cursor:default;
}
.link-box span{
    color:rgba(255,255,255,0.7);
    font-size:13px;
    word-break:break-all;
    text-align:left;
}
.copy-btn{
    background:#1e3a5f;
    border:1px solid rgba(0,200,255,0.3);
    border-radius:8px;
    padding:6px 12px;
    color:#00cfff;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
    transition:0.2s;
    flex-shrink:0;
}
.copy-btn:hover{
    background:#00cfff;
    color:#0b1020;
}
/* MOBILE */
@media(max-width:900px){
.container{
    grid-template-columns:1fr;
}
.card{
    padding:35px 20px;
}
}
</style>
</head>
<body>
<div class="container">
    <!-- ENLAZADOS PREMIUM -->
    <div class="card" onclick="window.open('https://enlazados-pro.netlify.app/', '_blank')">
        <div class="icon">💎</div>
        <h2>Enlazados Premium</h2>
        <div class="link-box" onclick="event.stopPropagation()">
            <span>enlazados-pro.netlify.app</span>
            <button class="copy-btn" onclick="navigator.clipboard.writeText('https://enlazados-pro.netlify.app/');this.textContent='✓ Copiado';setTimeout(()=>this.textContent='Copiar',2000)">Copiar</button>
    </div>
    </div>
    <!-- SAFE GAME -->
    <div class="card" onclick="window.open('https://lunna23483.github.io/enlazados-profile/', '_blank')">
        <div class="icon">🎮</div>
        <h2>Safe/Game</h2>
    </div>
    <!-- ENLAZADOS WEB -->
    <div class="card" onclick="window.open('https://enlazados-web.netlify.app/', '_blank')">
        <div class="icon">🌐</div>
        <h2>Enlazados Web</h2>
        <div class="link-box" onclick="event.stopPropagation()">
            <span>enlazados-web.netlify.app</span>
            <button class="copy-btn" onclick="navigator.clipboard.writeText('https://enlazados-web.netlify.app/');this.textContent='✓ Copiado';setTimeout(()=>this.textContent='Copiar',2000)">Copiar</button>
        </div>
    </div>
</div>
</body>
</html>
