<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enlazados</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0b1020;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:1100px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.card{
    background:#111936;
    border:1px solid rgba(255,255,255,0.1);
    border-radius:25px;
    padding:40px 25px;
    text-align:center;
    transition:0.3s;
    cursor:pointer;
    position:relative;
    overflow:hidden;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 10px 30px rgba(0,255,255,0.2);
}

.icon{
    font-size:60px;
    margin-bottom:20px;
}

h2{
    color:white;
    font-size:28px;
    margin-bottom:15px;
}

/* URL */
.url{
    color:#9fb3ff;
    font-size:14px;
    word-break:break-word;
    margin-bottom:18px;
    opacity:0.85;
}

/* BOTON */
.copy-btn{
    background:#1d2b5f;
    border:none;
    color:white;
    padding:10px 18px;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
    font-size:14px;
}

.copy-btn:hover{
    background:#2f4bb3;
    box-shadow:0 0 15px rgba(0,255,255,0.3);
}

/* MOBILE */
@media(max-width:900px){

.container{
    grid-template-columns:1fr;
}

.card{
    padding:35px 20px;
}

}
</style>
</head>

<body>

<div class="container">

    <!-- ENLAZADOS PREMIUM -->
    <div class="card">
        <div class="icon">💎</div>
        <h2>Enlazados Premium</h2>

        <div class="url">
            enlazados-premiu.netlify.app
        </div>

        <button class="copy-btn"
        onclick="copiarLink('https://enlazados-premiu.netlify.app/')">
            Copiar enlace
        </button>
    </div>

    <!-- SAFE GAME -->
    <div class="card">
        <div class="icon">🎮</div>
        <h2>Safe/Game</h2>

        <div class="url">
            lunna23483.github.io/enlazados-profile
        </div>

        <button class="copy-btn"
        onclick="copiarLink('https://lunna23483.github.io/enlazados-profile/')">
            Copiar enlace
        </button>
    </div>

    <!-- ENLAZADOS WEB -->
    <div class="card">
        <div class="icon">🌐</div>
        <h2>Enlazados Web</h2>

        <div class="url">
            enlazados-web.netlify.app
        </div>

        <button class="copy-btn"
        onclick="copiarLink('https://enlazados-web.netlify.app/')">
            Copiar enlace
        </button>
    </div>

</div>

<script>
function copiarLink(link){
    navigator.clipboard.writeText(link);

    alert("✅ Enlace copiado");
}
</script>

</body>
</html>
