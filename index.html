<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enlazados</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}
body{
    background:#0b1020;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.container{
    width:100%;
    max-width:1100px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}
.card{
    background:#111936;
    border:1px solid rgba(255,255,255,0.1);
    border-radius:25px;
    padding:40px 25px;
    text-align:center;
    transition:0.3s;
    cursor:pointer;
}
.card:hover{
    transform:translateY(-8px);
    box-shadow:0 10px 30px rgba(0,255,255,0.2);
}
.icon{
    font-size:60px;
    margin-bottom:20px;
}
h2{
    color:white;
    font-size:28px;
}
/* MOBILE */
@media(max-width:900px){
.container{
    grid-template-columns:1fr;
}
.card{
    padding:35px 20px;
}
}
</style>
</head>
<body>
<div class="container">
    <!-- ENLAZADOS PREMIUM -->
    <div class="card" onclick="window.open('https://enlazados-premiu.netlify.app/', '_blank')">
        <div class="icon">💎</div>
        <h2>Enlazados Premium</h2>
    </div>
    <!-- SAFE GAME -->
    <div class="card" onclick="window.open('https://lunna23483.github.io/enlazados-profile/', '_blank')">
        <div class="icon">🎮</div>
        <h2>Safe/Game</h2>
    </div>
    <!-- ENLAZADOS WEB -->
    <div class="card" onclick="window.open('https://enlazados-web.netlify.app/', '_blank')">
        <div class="icon">🌐</div>
        <h2>Enlazados Web</h2>
    </div>
</div>
</body>
</html>
